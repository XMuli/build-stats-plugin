name: Build

on:
  push:
    branches: [master]
    tags: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package the plugin
        run: mvn -B -DskipTests package
      - name: Include the tag version in the package name
        if: startsWith(github.ref, 'refs/tags/')
        id: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          for file in target/*.hpi; do
            mv "$file" "target/build-stats-${version}.hpi"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: build-stats-${{ steps.package.outputs.version || 'hpi' }}
          path: target/*.hpi
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package the release
        run: mvn -B -DskipTests package
      - name: Include the tag version in the package name
        run: |
          version="${GITHUB_REF_NAME#v}"
          for file in target/*.hpi; do
            mv "$file" "target/build-stats-${version}.hpi"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: target/*.hpi
          generate_release_notes: true
          fail_on_unmatched_files: true
