<svg xmlns="http://www.w3.org/2000/svg" width="920" height="280" viewBox="0 0 920 280" role="img" aria-label="How to open Build Stats">
  <rect width="920" height="280" rx="16" fill="#f4f6f8"/>
  <g font-family="Segoe UI, sans-serif" font-size="14" fill="#1e2b4b">
    <rect x="24" y="36" width="250" height="208" rx="12" fill="#fff" stroke="#e4e9ee"/>
    <text x="44" y="68" font-weight="700">Jenkins</text>
    <rect x="44" y="88" width="210" height="36" rx="8" fill="#eef6fd" stroke="#3ca2ea"/>
    <text x="58" y="111">Top-right chart icon</text>
    <rect x="44" y="140" width="210" height="76" rx="8" fill="#fff" stroke="#e4e9ee"/>
    <text x="58" y="168">Home status card</text>
    <text x="58" y="190" fill="#5c6b80">Picture opens the plugin</text>
    <text x="58" y="208" fill="#5c6b80">Text opens that build</text>

    <path d="M274 110 H330" stroke="#3ca2ea" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M274 178 H330" stroke="#3ca2ea" stroke-width="2"/>

    <rect x="336" y="70" width="250" height="140" rx="12" fill="#fff" stroke="#3ca2ea"/>
    <text x="356" y="104" font-weight="700">Build Stats</text>
    <text x="356" y="132">Overview</text>
    <text x="356" y="156">Each pipeline</text>
    <text x="356" y="180">This computer</text>

    <path d="M586 140 H642" stroke="#3ca2ea" stroke-width="2"/>
    <rect x="648" y="36" width="248" height="208" rx="12" fill="#fff" stroke="#e4e9ee"/>
    <text x="668" y="68" font-weight="700">On the page</text>
    <text x="668" y="100">Counts, duration, queue</text>
    <text x="668" y="124">Success rate and triggers</text>
    <text x="668" y="148">Stage time</text>
    <text x="668" y="172">CPU, memory, disk, GPU</text>
    <text x="668" y="196">Status plate</text>
  </g>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#3ca2ea"/>
    </marker>
  </defs>
</svg>
